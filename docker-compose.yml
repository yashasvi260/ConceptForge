# Dev server without installing Node on the host: `docker compose up` → http://localhost:5173
services:
  dev:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "[ -d node_modules ] || npm ci; npm run dev -- --host 0.0.0.0"
